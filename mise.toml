[tools]
go = "1.26.6"
node = "26.7.0"
pnpm = "11.21.0"

[tasks.build]
description = "Build bin/waffle with a git-stamped version"
run = 'go build -ldflags "-X main.version=$(git describe --tags --always --dirty)" -o bin/waffle ./cmd/waffle'

[tasks.release]
description = "Release build (stamped version binary)"
run = 'go build -ldflags "-X main.version=$(git describe --tags --always --dirty)" -o bin/waffle ./cmd/waffle'

[tasks.vet]
run = "go vet ./..."

[tasks.test]
description = "Unit tests (includes internal/eval) and zero-network waffle eval (#63)"
run = """
mise run dashboard-generate
git diff --exit-code -- internal/dashboard/ui/*_templ.go
mise run dashboard-client-test
go test -race ./...
go run ./cmd/waffle eval
"""

[tasks.dashboard-generate]
description = "Generate Waffle Desk templ components"
run = "go tool templ generate -path internal/dashboard/ui"

[tasks.dashboard-client-test]
description = "Test the dependency-free Waffle Desk browser client"
run = """
node --test \
  internal/dashboard/ui/app_client_test.mjs \
  internal/dashboard/ui/today_client_test.mjs \
  internal/dashboard/ui/htmx_client_test.mjs \
  internal/dashboard/ui/capabilities_client_test.mjs \
  internal/dashboard/ui/tasks_client_test.mjs \
  internal/dashboard/ui/workspaces_client_test.mjs \
  internal/dashboard/ui/memory_client_test.mjs \
  internal/dashboard/ui/posture_client_test.mjs \
  internal/dashboard/ui/profiles_client_test.mjs \
  internal/dashboard/ui/setup_client_test.mjs
"""

[tasks.dashboard-install]
description = "Install Waffle Desk browser-test dependencies"
env = { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1" }
run = """
dashboard_node="$(mise which node)"
dashboard_pnpm_cli="$(dirname "$(mise which pnpm)")/dist/pnpm.mjs"
test "$("$dashboard_node" --version)" = "v$(mise current node)"
test "$("$dashboard_node" "$dashboard_pnpm_cli" --version)" = "$(mise current pnpm)"
"$dashboard_node" "$dashboard_pnpm_cli" --dir tools/dashboard-tests install --frozen-lockfile --ignore-scripts
"""

[tasks.dashboard-test]
description = "Run Waffle Desk browser tests with system Chrome"
run = """
dashboard_node="$(mise which node)"
dashboard_pnpm_cli="$(dirname "$(mise which pnpm)")/dist/pnpm.mjs"
test "$("$dashboard_node" --version)" = "v$(mise current node)"
test "$("$dashboard_node" "$dashboard_pnpm_cli" --version)" = "$(mise current pnpm)"
"$dashboard_node" "$dashboard_pnpm_cli" --dir tools/dashboard-tests test
"""

[tasks.dashboard-check]
description = "Run the complete Waffle Desk browser rollout gate"
run = """
mise run dashboard-install
mise run dashboard-test
"""

[tasks.fmt]
run = "gofmt -l . && test -z \"$(gofmt -l .)\""

[tasks.lint]
run = "golangci-lint run ./..."

[tasks.brand-install]
run = "pnpm --dir tools/brand-assets install --frozen-lockfile"

[tasks.brand-check]
description = "Test raster tooling and validate Waffle manifests when present"
run = "pnpm --dir tools/brand-assets test && node tools/brand-assets/validate-raster.mjs --optional assets/brand/waffle/manifest.json assets/brand/waffle/animation/idle/manifest.json && node tools/brand-assets/validate-rig.mjs --optional assets/brand/waffle/rigs/standing-v1/rig.json assets/brand/waffle/rigs/standing-v2/rig.json"

[tasks.brand-rig-check]
description = "Validate the Waffle layered standing rig when present"
run = "node tools/brand-assets/validate-rig.mjs --optional assets/brand/waffle/rigs/standing-v1/rig.json assets/brand/waffle/rigs/standing-v2/rig.json"

[tasks.website-install]
description = "Install website dependencies (marketing homepage + docs site)"
dir = "website"
run = "npm ci"

[tasks.website-check]
description = "Build the website and run its tests"
dir = "website"
run = "npm test"

[tasks.docs-screenshots]
description = "Regenerate Waffle Desk screenshots for the documentation site"
dir = "tools/dashboard-tests"
run = """
pnpm install --frozen-lockfile --ignore-scripts
pnpm run capture-docs-screenshots
"""
