[tools]
go = "1.25.12"

[tasks.build]
description = "Build bin/waffle with a git-stamped version"
run = 'go build -ldflags "-X main.version=$(git describe --tags --always --dirty)" -o bin/waffle ./cmd/waffle'

[tasks.release]
description = "Release build (stamped version binary)"
run = 'go build -ldflags "-X main.version=$(git describe --tags --always --dirty)" -o bin/waffle ./cmd/waffle'

[tasks.vet]
run = "go vet ./..."

[tasks.test]
description = "Unit tests (includes internal/eval) and zero-network waffle eval (#63)"
run = """
go test -race ./...
go run ./cmd/waffle eval
"""

[tasks.fmt]
run = "gofmt -l . && test -z \"$(gofmt -l .)\""

[tasks.lint]
run = "golangci-lint run ./..."

[tasks.brand-install]
run = "pnpm --dir tools/brand-assets install --frozen-lockfile"

[tasks.brand-check]
description = "Test raster tooling and validate Waffle manifests when present"
run = "pnpm --dir tools/brand-assets test && node tools/brand-assets/validate-raster.mjs --optional assets/brand/waffle/manifest.json assets/brand/waffle/animation/idle/manifest.json && node tools/brand-assets/validate-rig.mjs --optional assets/brand/waffle/rigs/standing-v1/rig.json"

[tasks.brand-rig-check]
description = "Validate the Waffle layered standing rig when present"
run = "node tools/brand-assets/validate-rig.mjs --optional assets/brand/waffle/rigs/standing-v1/rig.json"
