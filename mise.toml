[tools]
go = "1.25.12"

[tasks.build]
description = "Build bin/waffle with a git-stamped version"
run = 'go build -ldflags "-X main.version=$(git describe --tags --always --dirty)" -o bin/waffle ./cmd/waffle'

[tasks.release]
description = "Release build (stamped version binary)"
run = 'go build -ldflags "-X main.version=$(git describe --tags --always --dirty)" -o bin/waffle ./cmd/waffle'

[tasks.vet]
run = "go vet ./..."

[tasks.test]
description = "Unit tests (includes internal/eval) and zero-network waffle eval (#63)"
run = """
go test -race ./...
go run ./cmd/waffle eval
"""

[tasks.fmt]
run = "gofmt -l . && test -z \"$(gofmt -l .)\""

[tasks.lint]
run = "golangci-lint run ./..."

[tasks.brand-install]
run = "pnpm --dir tools/brand-assets install --frozen-lockfile"

[tasks.brand-check]
run = "pnpm --dir tools/brand-assets test && node tools/brand-assets/validate-svg.mjs assets/brand/waffle/canon/model-sheet.svg assets/brand/waffle/canon/expression-sheet.svg assets/brand/waffle/source/waffle-motion-master.svg assets/brand/waffle/poses/standing.svg assets/brand/waffle/poses/sitting.svg assets/brand/waffle/poses/curled.svg"

[tasks.brand-render]
run = "node tools/brand-assets/render-all.mjs"
