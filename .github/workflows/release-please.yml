name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default: only the jobs that publish a release get write
# scopes, granted at the job level. A top-level write scope hands every job in
# the workflow a credential it does not need.
permissions:
  contents: read

jobs:
  release-please:
    # Reusable workflows can only narrow the caller's token, never widen it, so
    # the write scopes release-please needs have to be granted here.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: matt-riley/matt-riley-ci/.github/workflows/release-please.yml@4ff76b1a606b1fbba163119a65bf7b05f91ab9b6 # v3
    with:
      config-file: release-please-config.json
      manifest-file: .release-please-manifest.json
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  # release-please publishes a release with no assets, so a consumer has
  # nothing to verify. Build the linux artifact at the tagged commit, attest
  # its provenance through Sigstore, attach both to the release, and only then
  # publish it.
  #
  # The publish step is not optional here: this repository has immutable
  # releases enabled, and a published release rejects asset uploads with
  # "HTTP 422: Cannot upload assets to an immutable release". So the release
  # is created as a draft (see release-please-config.json) and becomes
  # immutable at the end of this job, with its artifacts already attached.
  # force-tag-creation keeps the git tag appearing immediately, which a draft
  # release would otherwise defer until publication -- the build stamps its
  # version from `git describe --tags`.
  #
  # A failure anywhere below leaves the release unpublished rather than
  # published-and-unverifiable, which is the right way round.
  #
  # This runs here rather than on `release: published` because the release is
  # created with GITHUB_TOKEN, and events raised by GITHUB_TOKEN never start a
  # new workflow run.
  release-artifacts:
    name: attach signed release artifacts
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # upload assets onto the published release
      id-token: write # Sigstore OIDC identity backing the provenance signature
      attestations: write # record the attestation against this repository
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # build-linux-artifact.sh stamps the version from `git describe
          # --tags`, so the tag release-please just pushed must be present.
          fetch-depth: 0
      # One toolchain source of truth: dev, CI, and release builds all use the
      # Go pinned in mise.toml. go.mod keeps its own (older) language version
      # on purpose; it must not select the release compiler.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.8.14
          install: true
          cache: true
          cache_save: false
      - name: Build artifact
        run: >
          scripts/build-linux-artifact.sh
          "$RUNNER_TEMP/waffle-artifact"
          "${{ github.run_id }}"
          "${{ github.repository }}"
          "refs/tags/$TAG_NAME"
          "${{ github.sha }}"
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/waffle-artifact/waffle-linux-amd64.tar.gz
      - name: Stage the provenance bundle beside the artifact
        run: cp "${{ steps.attest.outputs.bundle-path }}" "$RUNNER_TEMP/waffle-artifact/waffle-linux-amd64.tar.gz.intoto.jsonl"
      # `gh release upload` resolves a draft release by its pending tag name,
      # so the tag argument is the same either way.
      - name: Attach the artifact and its provenance to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "$TAG_NAME"
          "$RUNNER_TEMP/waffle-artifact/waffle-linux-amd64.tar.gz"
          "$RUNNER_TEMP/waffle-artifact/waffle-linux-amd64.tar.gz.intoto.jsonl"
          --clobber
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG_NAME" --draft=false
