name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  deterministic-eval:
    name: deterministic agent evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: go run ./cmd/waffle eval

  ci:
    uses: matt-riley/matt-riley-ci/.github/workflows/ci.yml@main
    with:
      build: true
      vet: true
      test: true
      cancel-in-progress: true
      concurrency-suffix: ci

  lint:
    uses: matt-riley/matt-riley-ci/.github/workflows/go-lint.yml@main
    with:
      cancel-in-progress: true
      concurrency-suffix: lint

  security:
    uses: matt-riley/matt-riley-ci/.github/workflows/go-security.yml@main
    with:
      cancel-in-progress: true
      concurrency-suffix: security

  build-linux-artifact:
    name: build linux artifact
    runs-on: ubuntu-latest
    needs: [deterministic-eval, ci, lint, security, linux-artifact-repro]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build artifact
        run: >
          scripts/build-linux-artifact.sh
          "${{ runner.temp }}/waffle-artifact"
          "${{ github.run_id }}"
          "${{ github.repository }}"
          "${{ github.ref }}"
          "${{ github.sha }}"
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: waffle-linux-amd64
          path: ${{ runner.temp }}/waffle-artifact/waffle-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 7

  linux-artifact-repro:
    name: linux artifact repro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Check Linux artifact reproducibility
        run: bash scripts/check-linux-artifact-repro.sh

  request-infra-deploy:
    needs: build-linux-artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.APP_ID != ''
    uses: matt-riley/matt-riley-ci/.github/workflows/request-infra-deploy.yml@v2
    with:
      app-name: waffle
      infra-repo: infra
      artifact-run-id: ${{ github.run_id }}
      artifact-name: waffle-linux-amd64
      artifact-digest: ${{ needs.build-linux-artifact.outputs.artifact_digest }}
    secrets:
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
