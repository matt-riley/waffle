name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: matt-riley/matt-riley-ci/.github/workflows/ci.yml@main
    with:
      build: true
      vet: true
      test: true
      cancel-in-progress: true

  lint:
    uses: matt-riley/matt-riley-ci/.github/workflows/go-lint.yml@main
    with:
      cancel-in-progress: true

  security:
    uses: matt-riley/matt-riley-ci/.github/workflows/go-security.yml@main
    with:
      cancel-in-progress: true
