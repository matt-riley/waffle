name: ci

on:
  push:
    branches: [main]
  pull_request:
  # A main run that fails cannot be retried when the failure is a workflow-call
  # validation error rather than a job, and the deploy path requires a run whose
  # conclusion is success. Without a manual trigger the only recovery is an
  # otherwise pointless commit.
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  deterministic-eval:
    name: deterministic agent evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4
        with:
          version: 2026.7.12
          install: true
          cache: true
          cache_save: false
      - uses: ./.github/actions/restore-go-caches
        with:
          dependency-hash: ${{ hashFiles('go.mod', 'go.sum') }}
      - run: go run ./cmd/waffle eval

  dashboard-browser:
    name: dashboard browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4
        with:
          version: 2026.7.12
          install: true
          cache: true
          cache_save: false
      - uses: ./.github/actions/restore-go-caches
        with:
          dependency-hash: ${{ hashFiles('go.mod', 'go.sum') }}
      - name: Verify browser runtime
        run: |
          test "$(node --version)" = "v26.1.0"
          test "$(pnpm --version)" = "11.9.0"
          google-chrome --version
      - name: Run Waffle Desk browser gate
        env:
          CI: "true"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: mise run dashboard-check

  ci:
    uses: matt-riley/matt-riley-ci/.github/workflows/ci.yml@be1549198ac2b0582dd19d0da8ef7872c2fb653b
    with:
      build: true
      vet: true
      test: true
      save-cache: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
      cancel-in-progress: true
      concurrency-suffix: ci

  lint:
    uses: matt-riley/matt-riley-ci/.github/workflows/go-lint.yml@be1549198ac2b0582dd19d0da8ef7872c2fb653b
    with:
      cancel-in-progress: true
      concurrency-suffix: lint

  security:
    uses: matt-riley/matt-riley-ci/.github/workflows/go-security.yml@5cb8c0d9ccc5e79c3ef18514ef958aa457de6e0c
    with:
      cancel-in-progress: true
      concurrency-suffix: security

  build-linux-artifact:
    name: build linux artifact
    runs-on: ubuntu-latest
    needs: [deterministic-eval, dashboard-browser, ci, lint, security, linux-artifact-repro]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/restore-go-caches
        with:
          dependency-hash: ${{ hashFiles('go.mod', 'go.sum') }}
      - name: Build artifact
        run: >
          scripts/build-linux-artifact.sh
          "${{ runner.temp }}/waffle-artifact"
          "${{ github.run_id }}"
          "${{ github.repository }}"
          "${{ github.ref }}"
          "${{ github.sha }}"
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: waffle-linux-amd64
          path: ${{ runner.temp }}/waffle-artifact/waffle-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 7

  linux-artifact-repro:
    name: linux artifact repro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check Linux artifact reproducibility
        run: bash scripts/check-linux-artifact-repro.sh

  request-infra-deploy:
    needs: build-linux-artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.APP_ID != ''
    uses: matt-riley/matt-riley-ci/.github/workflows/request-infra-deploy.yml@v2
    with:
      app-name: waffle
      infra-repo: infra
      artifact-run-id: ${{ github.run_id }}
      artifact-name: waffle-linux-amd64
      artifact-digest: ${{ needs.build-linux-artifact.outputs.artifact_digest }}
    secrets:
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
