name: ci

on:
  push:
    branches: [main]
  pull_request:
  # A main run that fails cannot be retried when the failure is a workflow-call
  # validation error rather than a job, and the deploy path requires a run whose
  # conclusion is success. Without a manual trigger the only recovery is an
  # otherwise pointless commit.
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  deterministic-eval:
    name: deterministic agent evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          version: 2026.8.11
          install: true
          cache: true
          cache_save: false
      - uses: ./.github/actions/restore-go-caches
        with:
          dependency-hash: ${{ hashFiles('go.mod', 'go.sum') }}
      - run: go run ./cmd/waffle eval

  dashboard-browser:
    name: dashboard browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          version: 2026.8.11
          install: true
          cache: true
          cache_save: false
      - uses: ./.github/actions/restore-go-caches
        with:
          dependency-hash: ${{ hashFiles('go.mod', 'go.sum') }}
      - name: Verify browser runtime
        run: |
          test "$(node --version)" = "v$(mise current node)"
          test "$(pnpm --version)" = "$(mise current pnpm)"
          google-chrome --version
      - name: Run Waffle Desk browser gate
        env:
          CI: "true"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: mise run dashboard-check

  website:
    name: website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          version: 2026.8.11
          install: true
          cache: true
          cache_save: false
      - name: Install website dependencies
        run: mise run website-install
      - name: Build the website and run its tests
        run: mise run website-check

  # The universal-ci reusable workflow ran build, test, and vet serially in one
  # job, and `go test -race ./...` is ~97% of that job's wall time. CI now runs
  # the race suite across nine parallel runners: internal/workspace and
  # cmd/waffle are each split across three runners by test name (-run), while
  # the remaining packages are split across three runners by measured package
  # weight (scripts/ci-test-shard.sh). The cheap build/vet/dashboard work runs
  # in a separate parallel job. Caches are still saved on main by ci-cache-save
  # so every other run keeps restoring warm caches.
  ci:
    name: ci (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}-${{ matrix.name }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: workspace group 1/3
            workspace_group: 1
            pkg_shard: ''
            cmd_group: ''
          - name: workspace group 2/3
            workspace_group: 2
            pkg_shard: ''
            cmd_group: ''
          - name: workspace group 3/3
            workspace_group: 3
            pkg_shard: ''
            cmd_group: ''
          - name: cmd/waffle group 1/3
            workspace_group: ''
            pkg_shard: ''
            cmd_group: 1
          - name: cmd/waffle group 2/3
            workspace_group: ''
            pkg_shard: ''
            cmd_group: 2
          - name: cmd/waffle group 3/3
            workspace_group: ''
            pkg_shard: ''
            cmd_group: 3
          - name: package shard 1/3
            workspace_group: ''
            pkg_shard: 1
            cmd_group: ''
          - name: package shard 2/3
            workspace_group: ''
            pkg_shard: 2
            cmd_group: ''
          - name: package shard 3/3
            workspace_group: ''
            pkg_shard: 3
            cmd_group: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          version: 2026.8.11
          install: true
          cache: true
          cache_save: false
      - uses: ./.github/actions/restore-go-caches
        with:
          dependency-hash: ${{ hashFiles('go.mod', 'go.sum') }}
      - name: Run workspace test group
        if: matrix.workspace_group != ''
        run: bash scripts/ci-test-shard.sh workspace ${{ matrix.workspace_group }} 3
      - name: Run cmd/waffle test group
        if: matrix.cmd_group != ''
        run: bash scripts/ci-test-shard.sh cmd ${{ matrix.cmd_group }} 3
      - name: Run package test shard
        if: matrix.pkg_shard != ''
        run: bash scripts/ci-test-shard.sh pkg ${{ matrix.pkg_shard }} 3

  ci-aux:
    name: ci build, vet, dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}-aux
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          version: 2026.8.11
          install: true
          cache: true
          cache_save: false
      - uses: ./.github/actions/restore-go-caches
        with:
          dependency-hash: ${{ hashFiles('go.mod', 'go.sum') }}
      - run: mise run build
      - run: mise run vet
      - name: Dashboard generate and client tests
        run: |
          mise run dashboard-generate
          git diff --exit-code -- internal/dashboard/ui/*_templ.go
          mise run dashboard-client-test

  ci-cache-save:
    name: save CI caches
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [ci, ci-aux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}-cache-save
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The only job that writes the mise cache. Without this the cache key is
      # never populated, so `cache: true` in every other job always misses and
      # each one re-downloads the mise tarball from GitHub releases — six
      # download attempts per run, every run, each a chance to fail the whole
      # job on a transient connection reset before any test body executes.
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          version: 2026.8.11
          install: true
          cache: true
          cache_save: true
      - name: Detect Go cache metadata
        id: metadata
        shell: bash
        run: |
          {
            echo "version=$(go env GOVERSION)"
            echo "module_cache=$(go env GOMODCACHE)"
            echo "build_cache=$(go env GOCACHE)"
          } >> "$GITHUB_OUTPUT"
      - name: Restore Go module cache
        id: restore-go-modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.metadata.outputs.module_cache }}
          key: go-mod-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.metadata.outputs.version }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-mod-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.metadata.outputs.version }}-
      - name: Restore Go build cache
        id: restore-go-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.metadata.outputs.build_cache }}
          key: go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.metadata.outputs.version }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.metadata.outputs.version }}-${{ hashFiles('go.mod', 'go.sum') }}-
      - name: Save Go module cache
        if: steps.restore-go-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.metadata.outputs.module_cache }}
          key: ${{ steps.restore-go-modules.outputs.cache-primary-key }}
      - name: Save Go build cache
        if: steps.restore-go-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.metadata.outputs.build_cache }}
          key: ${{ steps.restore-go-build.outputs.cache-primary-key }}

  lint:
    uses: matt-riley/matt-riley-ci/.github/workflows/go-lint.yml@a6a9d0cf05916bbc5a44f0bc9818133ab08baba4
    with:
      cancel-in-progress: true
      concurrency-suffix: lint

  security:
    uses: matt-riley/matt-riley-ci/.github/workflows/go-security.yml@a6a9d0cf05916bbc5a44f0bc9818133ab08baba4
    with:
      cancel-in-progress: true
      concurrency-suffix: security

  docker-integration:
    name: docker integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          version: 2026.8.11
          install: true
          cache: true
          cache_save: false
      - uses: ./.github/actions/restore-go-caches
        with:
          dependency-hash: ${{ hashFiles('go.mod', 'go.sum') }}
      # Every suite reports even when an earlier one fails: these gates were
      # previously runnable only on maintainer machines, and one stale test
      # must not mask the others' results.
      - name: Docker-gated sandbox, netlock, and workspace suites
        run: |
          status=0
          WAFFLE_TEST_DOCKER=1 go test -tags=sandbox_docker ./internal/sandbox -count=1 || status=1
          WAFFLE_TEST_DOCKER=1 go test -tags=sandbox_stress ./internal/sandbox -run Stress -count=1 || status=1
          WAFFLE_TEST_DOCKER=1 go test ./internal/netlock -count=1 || status=1
          WAFFLE_TEST_DOCKER=1 go test ./internal/workspace -run TestDocker -count=1 || status=1
          exit $status

  build-linux-artifact:
    name: build linux artifact
    runs-on: ubuntu-latest
    # linux-artifact-repro deliberately does not gate this job: running the
    # build in parallel with the repro check removes ~140s of serial time from
    # every main run. The repro gate moves to request-infra-deploy instead, so
    # no deploy is dispatched for a run whose artifact is not reproducible
    # (#335).
    needs: [deterministic-eval, dashboard-browser, ci, ci-aux, lint, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # One toolchain source of truth: dev, CI, and release builds all use the
      # Go pinned in mise.toml. go.mod keeps its own (older) language version
      # on purpose; it must not select the release compiler.
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          version: 2026.8.11
          install: true
          cache: true
          cache_save: false
      - uses: ./.github/actions/restore-go-caches
        with:
          dependency-hash: ${{ hashFiles('go.mod', 'go.sum') }}
      - name: Build artifact
        run: >
          scripts/build-linux-artifact.sh
          "${{ runner.temp }}/waffle-artifact"
          "${{ github.run_id }}"
          "${{ github.repository }}"
          "${{ github.ref }}"
          "${{ github.sha }}"
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: waffle-linux-amd64
          path: ${{ runner.temp }}/waffle-artifact/waffle-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 7

  linux-artifact-repro:
    name: linux artifact repro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # One toolchain source of truth: dev, CI, and release builds all use the
      # Go pinned in mise.toml. go.mod keeps its own (older) language version
      # on purpose; it must not select the release compiler.
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          version: 2026.8.11
          install: true
          cache: true
          cache_save: false
      - name: Check Linux artifact reproducibility
        run: bash scripts/check-linux-artifact-repro.sh

  request-infra-deploy:
    # linux-artifact-repro gates the dispatch (not the artifact build): a
    # deploy request must not leave the run while reproducibility is still
    # being checked. Any other late failure (e.g. ci) is still caught by the
    # run-level gate — deploy-waffle.yml requires the source run's
    # .status == "completed" and .conclusion == "success" per #240.
    #
    # Pinned to the fix commit of matt-riley/matt-riley-ci#104: the workflow's
    # artifact-run-id input is declared type: string because a reusable
    # workflow input of type: number rejects expression values, so
    # `artifact-run-id: ${{ github.run_id }}` failed workflow-call validation
    # (greyed, never-started job; run conclusion failure) whenever vars.APP_ID
    # was set (#240).
    needs: [build-linux-artifact, linux-artifact-repro]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.APP_ID != ''
    uses: matt-riley/matt-riley-ci/.github/workflows/request-infra-deploy.yml@a6a9d0cf05916bbc5a44f0bc9818133ab08baba4
    with:
      app-name: waffle
      infra-repo: infra
      artifact-run-id: ${{ github.run_id }}
      artifact-name: waffle-linux-amd64
      artifact-digest: ${{ needs.build-linux-artifact.outputs.artifact_digest }}
    secrets:
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
