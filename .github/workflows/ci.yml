name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  deterministic-eval:
    name: deterministic agent evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: go run ./cmd/waffle eval

  ci:
    uses: matt-riley/matt-riley-ci/.github/workflows/ci.yml@main
    with:
      build: true
      vet: true
      test: true
      cancel-in-progress: true
      concurrency-suffix: ci

  lint:
    uses: matt-riley/matt-riley-ci/.github/workflows/go-lint.yml@main
    with:
      cancel-in-progress: true
      concurrency-suffix: lint

  security:
    uses: matt-riley/matt-riley-ci/.github/workflows/go-security.yml@main
    with:
      cancel-in-progress: true
      concurrency-suffix: security

  build-linux-artifact:
    name: build linux artifact
    runs-on: ubuntu-latest
    needs: [deterministic-eval, ci, lint, security, linux-artifact-repro]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Build artifact
        run: >
          scripts/build-linux-artifact.sh
          "${{ runner.temp }}/waffle-artifact"
          "${{ github.run_id }}"
          "${{ github.repository }}"
          "${{ github.ref }}"
          "${{ github.sha }}"
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: waffle-linux-amd64
          path: ${{ runner.temp }}/waffle-artifact/waffle-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 7

  linux-artifact-repro:
    name: linux artifact repro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Check Linux artifact reproducibility
        run: bash scripts/check-linux-artifact-repro.sh

  request-infra-deploy:
    needs: build-linux-artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: matt-riley/matt-riley-ci/.github/workflows/request-infra-deploy.yml@v1
    with:
      app-name: waffle
      infra-repo: infra
      artifact-run-id: ${{ github.run_id }}
      artifact-name: waffle-linux-amd64
      artifact-digest: ${{ needs.build-linux-artifact.outputs.artifact_digest }}
    secrets:
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
