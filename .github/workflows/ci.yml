name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  deterministic-eval:
    name: deterministic agent evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: go run ./cmd/waffle eval

  ci:
    uses: matt-riley/matt-riley-ci/.github/workflows/ci.yml@main
    with:
      build: true
      vet: true
      test: true
      cancel-in-progress: true
      concurrency-suffix: ci

  lint:
    uses: matt-riley/matt-riley-ci/.github/workflows/go-lint.yml@main
    with:
      cancel-in-progress: true
      concurrency-suffix: lint

  security:
    uses: matt-riley/matt-riley-ci/.github/workflows/go-security.yml@main
    with:
      cancel-in-progress: true
      concurrency-suffix: security
