# Provider-free waffle config with named agent profiles. Copy to
# $WAFFLE_HOME/config.toml and adjust. Profiles are a *trust boundary* (system,
# model, tools, sandbox) — not personality presets alone.
#
# Migration: existing installs with no [agent.profile] section keep today's
# default agent construction as the effective "main" profile. The legacy
# singular [provider] table also remains supported and is normalized in memory.
# No change required for either existing configuration form.
#
# Providers are optional. A newly deployed system may omit [providers],
# [models], default_model, and utility_model until `waffle provider add`
# validates the first connection on the host. Waffle connects to these named
# connections directly and uses embedded SQLite; no external router or
# application database is required.
#
# Prefer the management command over hand-editing provider config because it
# probes the upstream and commits the encrypted credential and config
# transactionally. Presets are openai, anthropic, openrouter, and
# openai-compatible. Only openai-compatible requires a base URL. Bare guided
# add reads a hidden credential and uses it to authenticate model discovery.
# If discovery fails, guided add offers manual ALIAS=UPSTREAM entry; successful
# discovery lets you select favourite aliases:
#   sudo waffle provider add
#   sudo waffle provider models openrouter --search claude
#   sudo waffle provider models openrouter --refresh
#   sudo waffle provider model add openrouter anthropic/claude-sonnet-4.6 --default
#   sudo waffle provider model activate ALIAS
#   sudo waffle provider model remove ALIAS [--replace-with ALIAS]
#   sudo waffle provider remove CONNECTION
#
# `provider models` filters with --search, refreshes upstream data with
# --refresh, and emits structured output with --json. Its owner-only catalogue
# cache is reused for 24 hours and is distinct from selected favourite aliases.
# A failed refresh returns a stale cache with a warning when one exists.
# Records are derived, non-authoritative discovery data: each contains the
# connection name, type, base URL, opaque scope, and model descriptors, but
# contains no API credential. They are disposable; selected favourite aliases
# remain authoritative configuration. In the guided picker, known exact IDs
# work directly; unknown numeric or navigation-like IDs use `id:<upstream-id>`
# to avoid row-number ambiguity. `provider model add` takes the upstream ID
# literally and must not receive the `id:` prefix. It validates one exact ID;
# --default and --utility assign roles. Explicit automation must supply at
# least one --model ALIAS=UPSTREAM and read credentials from stdin or a
# root-owned 0600 file, never from command-line values. This example
# deliberately configures no provider, model alias, default_model,
# utility_model, or secret.

# Optional standalone local chat service. Managed deployments normally receive
# /run/waffle/chat.sock from systemd socket activation instead. This server
# setting does not change client selection: `waffle chat` stays in direct mode
# unless --socket or WAFFLE_CHAT_SOCKET explicitly selects a socket.
# Standalone mode authorizes the effective service UID. Every requested and
# canonical ancestor must be owned by root or that UID; group/other-writable
# ancestors must be sticky. The dedicated parent must be a real, same-UID 0700
# directory (missing components are created privately), and the socket is 0600.
# [chat]
# socket = "/absolute/path/to/waffle/chat.sock"

# Optional Waffle Desk web interface. It is disabled by default.
[dashboard]
enabled = false
# skill_import_roots = ["/absolute/path/to/reviewed-skills"]
# github.com supports public repositories at exact full commits through a
# bounded codeload archive; private/authenticated repositories fail closed.
# skill_git_hosts = ["github.com"]

# Optional tailnet access for Desk. Disabled by default. This does NOT change
# the bind address: gateway.status_listen stays loopback-only, and that is what
# makes the Tailscale identity headers trustworthy. Requests admitted through
# this path may address only /desk/ and /api/v1/desk/*; /status and /healthz
# stay loopback-only in every configuration.
#
# Required companion command on the same host, which persists across reboots:
#   tailscale serve --bg --https=443 http://127.0.0.1:8422
#
# Never combine this with Tailscale Funnel: Funnel is public, and Desk rejects
# any request Serve marks as a Funnel request.
# [dashboard.tailnet]
# enabled = true
# The exact MagicDNS name Serve answers on. A bare DNS name, never an IP or port.
# serve_host = "waffle.example-tailnet.ts.net"
# Tailscale logins permitted to use Desk, as tailscaled reports them. SSO logins
# are not email addresses (for example "user@github"). Tagged devices send no
# login and are always rejected.
# allowed_logins = ["user@github"]

[agent]
default_profile = "main"

# --- main: owner interactive default (explicit for documentation) ----------
[agent.profile.main]
system = "You are the owner's personal assistant."
model = "default"
sandbox = "host"
allowed_children = ["researcher", "reviewer"]
[agent.profile.main.tools]
allow = ["*"]
deny = []

# --- researcher: read/fetch heavy, no mutation -----------------------------
[agent.profile.researcher]
system = "You research thoroughly using read/fetch/search tools. Never mutate files or run shell."
model = "default"
sandbox = "docker"
[agent.profile.researcher.tools]
allow = ["read_file", "fetch", "search", "recall", "expand_output", "expand_context"]
deny = ["bash", "write_file", "edit_file", "remember", "memory_update", "distill_skill", "workspace_update"]

# --- reviewer: read-only code critique -------------------------------------
[agent.profile.reviewer]
system = "You are a strict code reviewer. Report issues; do not edit."
model = "default"
sandbox = "docker"
[agent.profile.reviewer.tools]
allow = ["read_file", "search", "recall", "expand_output", "expand_context"]
deny = ["bash", "write_file", "edit_file", "remember", "memory_update", "distill_skill", "workspace_update"]

# Surface binds (CLI):
#   waffle session profile telegram:42 reviewer
#   waffle cron add dig 0 9 * * 1 "summarize starred repos" --profile researcher
#   waffle chat --profile reviewer
#   waffle ws open owner/repo --profile reviewer

# Action-level tool rules (#66). Each rule requires at least one of tool,
# match, or regex (empty selectors are rejected at load). Empty tool matches
# any tool only when match or regex is set.
# [sandbox]
# enforcer = "feedback"  # none (default) | feedback
#
# [[policy.rule]]
# name = "no-rm"
# tool = "bash"
# match = "rm -rf"
# action = "deny"
# guidance = "use safer cleanup"
