version: "2"

linters:
  default: standard
  enable:
    - misspell
    - unconvert
    - nolintlint
  settings:
    errcheck:
      exclude-functions:
        # Terminal writes; if stdout is gone there is nobody to tell.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

formatters:
  enable:
    - gofmt
    - goimports
